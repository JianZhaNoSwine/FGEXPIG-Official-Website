<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FGEXPIG</title>
<style>
html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: #2a2a2a;
}
.splash {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: #2a2a2a;
  transition: opacity 220ms ease;
}
.splash.is-leaving {
  opacity: 0;
}
.splash img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  -webkit-user-drag: none;
  user-select: none;
}
.splash-base {
  filter: grayscale(1) brightness(0.72) contrast(0.92);
}
.splash-color {
  clip-path: inset(0 100% 0 0);
  transition: clip-path 120ms linear;
}
</style>
</head>
<body>
<div class="splash">
  <img class="splash-base" src="splash.png" alt="">
  <img class="splash-color" id="splashColor" src="splash.png" alt="">
</div>
<script>
(function () {
  function setProgress(percent) {
    percent = Math.max(0, Math.min(100, Number(percent) || 0));
    var color = document.getElementById('splashColor');
    if (color) color.style.clipPath = 'inset(0 ' + (100 - percent) + '% 0 0)';
  }
  window.updateDesktopSplashProgress = function (data) {
    if (!data) return;
    var current = Number(data.current) || 0;
    var target = Number(data.target) || 0;
    setProgress(target ? (current / target) * 100 : 0);
  };
  setProgress(0);
})();
</script>
</body>
</html>
