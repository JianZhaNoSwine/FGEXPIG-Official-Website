<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FGEXPIG</title>
<style>
  html, body {
    margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000;
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", "Sarasa Gothic SC", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  #stage { position: fixed; inset: 0; }
  .fade-out { opacity: 0 !important; transition: opacity 500ms ease; }

  /* 3) 壁纸幻灯片：图片放大到 150%，按随机方向匀速平移 */
  #slideLayer { position: absolute; inset: 0; overflow: hidden; background: #000; z-index: 10; }
  .slide { position: absolute; inset: 0; opacity: 0; transition: opacity 450ms ease; will-change: opacity; }
  .slide img {
    position: absolute; left: 50%; top: 50%;
    width: 130%; height: 130%; object-fit: cover;
    transform: translate(-50%, -50%);
    will-change: transform;
  }

  /* 1) open.webp + 优先缓存进度条（高度 92.59%，宽度 75.73% ~ 94.77%） */
  #openLayer { position: absolute; inset: 0; z-index: 30; background: #000; transition: opacity 500ms ease; }
  #openLayer > img { display: block; width: 100%; height: 100%; object-fit: cover; }
  #priorityBar {
    position: absolute; left: 75.73%; width: 19.04%; top: 92.59%;
    height: 8px; transform: translateY(-50%);
    border-radius: 999px; background: rgba(255, 255, 255, 0.22); overflow: hidden;
  }
  #priorityBar > i { display: block; height: 100%; width: 0%; background: #fff; transition: width 180ms linear; }

  /* 4) 普通缓存下载 / 校验进度（右下角） */
  /* 下载 / 校验普通缓存时的文字：套一层黑色胶囊底 */
  #taskProgress {
    position: absolute; right: 16px; bottom: 16px; z-index: 45;
    color: #fff; font-size: 14px; line-height: 1.2; text-align: right;
    font-variant-numeric: tabular-nums;
    padding: 7px 16px;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.8);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    pointer-events: none;
    white-space: nowrap;
  }
  #taskProgress[hidden] { display: none; }

  /* 5) menu.png + 4 个文本按钮 */
  /* 菜单入场：从左到右依次显示（左侧先出现，向右侧刷出） */
  #menuLayer {
    position: absolute; inset: 0; z-index: 50;
    clip-path: inset(0 100% 0 0);
    pointer-events: none;
    transition: clip-path 3200ms linear;
  }
  #menuLayer.is-visible { clip-path: inset(0 0 0 0); pointer-events: auto; }
  #menuLayer > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .menu-button {
    position: absolute; left: 11.95%; transform: translateY(-50%);
    margin: 0; padding: 0; border: 0; background: none;
    color: #fff; font: inherit; font-size: 20px; font-weight: 600; letter-spacing: 0.04em;
    text-align: left; cursor: pointer;
    text-shadow: 0 1px 2px #000, 0 0 8px rgba(0, 0, 0, 0.85);
    transition: color 150ms ease, transform 150ms ease;
  }
  .menu-button:nth-of-type(1) { top: 50%; }
  .menu-button:nth-of-type(2) { top: 55%; }
  .menu-button:nth-of-type(3) { top: 60%; }
  .menu-button:nth-of-type(4) { top: 65%; }
  .menu-button:hover, .menu-button:focus-visible {
    color: #ff72b6; outline: none; transform: translateY(-50%) translateX(6px);
  }
</style>
</head>
<body>
<div id="stage">
  <div id="slideLayer">
    <div class="slide" id="slideA"><img alt="" draggable="false"></div>
    <div class="slide" id="slideB"><img alt="" draggable="false"></div>
  </div>

  <div id="openLayer">
    <img src="assets/open.webp" alt="" draggable="false">
    <div id="priorityBar"><i id="priorityFill"></i></div>
  </div>

  <div id="taskProgress" hidden></div>

  <div id="menuLayer">
    <img src="assets/menu.png" alt="" draggable="false">
    <button class="menu-button" type="button" id="btnEnter">进入应用</button>
    <button class="menu-button" type="button" id="btnSite">访问官网</button>
    <button class="menu-button" type="button" id="btnGithub">GITHUB REPOSITORY</button>
    <button class="menu-button" type="button" id="btnQuit">退出应用</button>
  </div>
</div>
<script>
(function () {
  'use strict';
  var api = window.FGEXPIG_LAUNCHER || null;
  var slideEls = [document.getElementById('slideA'), document.getElementById('slideB')];
  var openLayer = document.getElementById('openLayer');
  var priorityFill = document.getElementById('priorityFill');
  var taskProgress = document.getElementById('taskProgress');
  var menuLayer = document.getElementById('menuLayer');
  var current = 0;
  var playlist = [];
  var playIndex = 0;
  var slidesRunning = false;
  var lastSrc = '';
  var lastDir = '';

  // 平移方向（图片为 130%，四周各多出约 15% 画面 ≈ 11.5% 元素尺寸，取 ±8% 留余量）
  var MOTION = {
    up: { from: 'translate(-50%, calc(-50% + 8%))', to: 'translate(-50%, calc(-50% - 8%))' },
    down: { from: 'translate(-50%, calc(-50% - 8%))', to: 'translate(-50%, calc(-50% + 8%))' },
    right: { from: 'translate(calc(-50% - 8%), -50%)', to: 'translate(calc(-50% + 8%), -50%)' },
    left: { from: 'translate(calc(-50% + 8%), -50%)', to: 'translate(calc(-50% - 8%), -50%)' }
  };
  var SLIDE_MOVE_MS = 6000;    // 每张壁纸展示 6 秒后切换
  var SLIDE_TRAVEL_MS = 8000;  // 位移仍按 8 秒走完全程（速度不变），因此 6 秒时不会移动完
  var DIRS = ['up', 'down', 'left', 'right'];

  function setPriorityPercent(percent) {
    var value = Math.max(0, Math.min(100, Number(percent) || 0));
    priorityFill.style.width = value.toFixed(1) + '%';
  }

  function setTaskText(text) {
    if (!text) {
      taskProgress.hidden = true;
      taskProgress.textContent = '';
      return;
    }
    taskProgress.hidden = false;
    if (taskProgress.textContent !== text) taskProgress.textContent = text;
  }

  var wallpapersPool = [];

  // 预加载下一张壁纸：切换瞬间即可显示，避免出现静止等待
  function preloadNextSlide() {
    if (!playlist.length) return;
    var nextIndex = playIndex >= playlist.length ? 0 : playIndex;
    var url = playlist[nextIndex];
    if (!url) return;
    var img = new Image();
    img.decoding = 'async';
    img.src = url;
  }

  function shuffle(list) {
    var out = list.slice();
    for (var i = out.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = out[i]; out[i] = out[j]; out[j] = tmp;
    }
    return out;
  }

  var H_DIRS = ['left', 'right'];
  var V_DIRS = ['up', 'down'];

  // 方向：上一张是左右 → 这一张只能上下随机；上一张是上下 → 这一张只能左右随机
  function pickDirection() {
    var horizontalLast = (lastDir === 'left' || lastDir === 'right');
    var pool = horizontalLast ? V_DIRS : H_DIRS;
    var dir = pool[Math.floor(Math.random() * pool.length)];
    lastDir = dir;
    return dir;
  }

  // 重新洗牌：保证循环衔接处第一张与上一张不同
  function refillPlaylist() {
    playlist = shuffle(wallpapersPool.slice());
    if (playlist.length > 1 && playlist[0] === lastSrc) {
      var swap = 1 + Math.floor(Math.random() * (playlist.length - 1));
      var tmp = playlist[0]; playlist[0] = playlist[swap]; playlist[swap] = tmp;
    }
    playIndex = 0;
  }

  // 取下一张：必与上一张不同
  function takeWallpaper() {
    if (!playlist.length) return '';
    if (playIndex >= playlist.length) refillPlaylist();
    if (playlist.length > 1 && playlist[playIndex] === lastSrc) {
      var alt = (playIndex + 1) % playlist.length;
      var swap = playlist[playIndex]; playlist[playIndex] = playlist[alt]; playlist[alt] = swap;
    }
    var value = playlist[playIndex];
    playIndex += 1;
    return value;
  }

  // 冻结当前图片：保持画面位置不再继续平移
  function freezeSlide(img) {
    if (!img) return;
    try {
      var frozen = getComputedStyle(img).transform;
      img.style.transition = 'none';
      if (frozen && frozen !== 'none') img.style.transform = frozen;
    } catch (err) {}
  }

  function showNextSlide() {
    if (!playlist.length) return;
    var next = slideEls[1 - current];
    var img = next.firstElementChild;
    var motion = MOTION[pickDirection()];
    var src = takeWallpaper();
    if (!src) return;
    lastSrc = src;

    img.style.transition = 'none';
    img.style.transform = motion.from;
    img.src = src;
    var reveal = function () {
      freezeSlide(slideEls[current].firstElementChild);
      requestAnimationFrame(function () {
        img.style.transition = 'transform ' + SLIDE_TRAVEL_MS + 'ms linear';
        img.style.transform = motion.to;
        next.style.opacity = '1';
        slideEls[current].style.opacity = '0';
        current = 1 - current;
      });
    };
    if (img.complete) reveal();
    else {
      img.addEventListener('load', reveal, { once: true });
      img.addEventListener('error', reveal, { once: true });
    }
    preloadNextSlide();
    setTimeout(showNextSlide, SLIDE_MOVE_MS);
  }

  function startSlides(wallpapers) {
    if (slidesRunning) return;
    slidesRunning = true;
    wallpapersPool = (wallpapers || []).slice();
    playlist = shuffle(wallpapersPool.slice());
    playIndex = 0;
    lastSrc = '';
    // 先随机挑一档的“假上一张”，第一张得到另一档的随机方向
    lastDir = Math.random() < 0.5 ? 'left' : 'up';
    openLayer.classList.add('fade-out');
    setTimeout(function () { openLayer.style.display = 'none'; }, 520);
    showNextSlide();
  }

  function startMusic() {
    var fallback = function () {
      var el = document.createElement('audio');
      el.src = 'assets/menu.mp3';
      el.loop = true;
      el.volume = 0.85;
      el.play().catch(function () {});
    };
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if (!api || typeof api.music !== 'function' || !Ctx) { fallback(); return; }
    api.music().then(function (bytes) {
      if (!bytes) { fallback(); return; }
      var buffer = bytes.buffer ? bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength) : bytes;
      var ctx = new Ctx();
      ctx.decodeAudioData(buffer, function (audio) {
        var src = ctx.createBufferSource();
        src.buffer = audio;
        src.loop = true;
        src.connect(ctx.destination);
        src.start(0);
        if (ctx.state === 'suspended' && ctx.resume) ctx.resume();
      }, fallback);
    }).catch(fallback);
  }

  function onMessage(message) {
    if (!message) return;
    if (message.type === 'priority') setPriorityPercent(message.percent);
    else if (message.type === 'slides') startSlides(message.wallpapers || []);
    else if (message.type === 'other') setTaskText('DOWNLOADING ' + (Number(message.percent) || 0).toFixed(2) + '%');
    else if (message.type === 'verify') setTaskText('VERIFYING (' + (message.current || 0) + '/' + (message.total || 0) + ')');
    else if (message.type === 'ready') {
      taskProgress.hidden = true;
      menuLayer.classList.add('is-visible');
    }
  }

  if (api && typeof api.onMessage === 'function') api.onMessage(onMessage);

  document.getElementById('btnEnter').addEventListener('click', function () {
    document.getElementById('stage').classList.add('fade-out');
    setTimeout(function () { if (api && api.enter) api.enter(); }, 520);
  });
  document.getElementById('btnSite').addEventListener('click', function () { if (api && api.openSite) api.openSite(); });
  document.getElementById('btnGithub').addEventListener('click', function () { if (api && api.github) api.github(); });
  document.getElementById('btnQuit').addEventListener('click', function () { if (api && api.quit) api.quit(); });

  startMusic();
  setPriorityPercent(0);
})();
</script>
</body>
</html>
